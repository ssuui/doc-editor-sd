display_name: "Hyperf 3.2 开发文档"
cover_img: ""
description: "Hyperf 是一个高性能、高灵活性的渐进式 PHP 协程框架，内置协程服务器及大量常用的组件，性能较传统基于 PHP-FPM的框架有质的提升，提供超高性能的同时，也保持着极其灵活的可扩展性，标准组件均基于PSR标准实现，基于强大的依赖注入设计，保证了绝大部分组件或类都是可替换与可复用的"
tags: ["Hyperf", "PHP", "SWOOLE"]
version: "v3.2"
