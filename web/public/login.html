<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: linear-gradient(135deg,#16324f,#f4efe6); min-height: 100vh; display: grid; place-items: center; }
    form { width: min(360px,92vw); background: rgba(255,255,255,.92); padding: 28px; border-radius: 18px; box-shadow: 0 18px 48px rgba(18,42,64,.18); }
    input, button { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #c8d3df; margin-top: 12px; box-sizing: border-box; }
    button { background: #16324f; color: #fff; border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <form id="login-form">
    <h2>管理登录</h2>
    <input id="username" placeholder="用户名" value="admin">
    <input id="password" type="password" placeholder="密码" value="">
    <button type="submit">登录</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const json = await res.json();
      if (json.code === 0) {
        localStorage.setItem('token', json.data.token);
        location.href = '/';
        return;
      }
      alert(json.msg || '登录失败');
    });
  </script>
</body>
</html>
